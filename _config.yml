# Base URL of the Site
baseurl: "/sa-portfolio"

# Google Analytics
google_analytics: G-2L8GP50MES

# Site Branding
title: "Sachin Suresh | Governance & Knowledge Management"

description: >
  Portfolio of Sachin Suresh covering cybersecurity governance,
  knowledge management, information architecture, process design,
  technical documentation, and emerging AI governance.

site-image: https://sachin-suresh.github.io/sa-portfolio/assets/images/og-image.jpg

site-keywords: >
  Sachin Suresh,
  cybersecurity governance,
  knowledge management,
  knowledge governance,
  information architecture,
  documentation governance,
  technical documentation,
  process design,
  workflow design,
  AI governance,
  responsible AI,
  REST API documentation

favicon-url:

# Optional Hero Image
heroimage: https://images.pexels.com/photos/220444/pexels-photo-220444.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940

# Social Media and Contact
email: sach7411.uae@gmail.com
facebook_username:
twitter_username:
instagram_username:
linkedin_username: sachin-mca
github_username:
youtube_channel_id:
reddit_username:
behance_username:
dribbble_username:
spotify_username:

# Author
author-name: "Sachin Suresh"
author-image:

author-about:

author-url: https://github.com/Sachin-Suresh

# SASS
sass:
  sass_dir: _sass
  style: compressed

# Build settings
plugins:
  - jekyll-admin
  - jekyll-feed

# Permalink
permalink: "blog/:title"

# Compress HTML
compress_html:
  clippings: all

# Defaults
defaults:
  -
    scope:
      type: 'posts'
    values:
      layout: post
      post-image: ""
      description: ""
      tags:
        - ""
  -
    scope:
      type: 'pages'
    values:
      layout: page

# Include standalone verification or special files
include:
  - googlec53646d4e8e1c312.html

# Exclude generated/dependency folders
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

under_maintenance: false