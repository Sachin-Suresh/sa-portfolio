---
layout: compress
---

<!DOCTYPE html>
<html>
  {% include head.html %}

  <body class="{% if page.url == '/' %}page-with-anchor-offset{% endif %}">
    {% include navbar.html %}

    {% if jekyll.environment == "production" and site.google_analytics %}
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', '{{ site.google_analytics }}');
    </script>
    {% endif %}


    <!-- Main content -->
    <main class="section main-content">
      <div class="container">
        {{ content }}
      </div>
    </main>

    <!-- Footer -->
    {% include footer.html %}
  </body>

  <script>
    // Optional: Dynamic nav highlight if using scroll behavior
    window.addEventListener("scroll", function () {
      const scroll = window.scrollY;
      const item = document.getElementsByClassName("navbar-item");

      if (scroll < 565) {
        item[1].classList.add("is-active");
        item[2].classList.remove("is-active");
        item[3].classList.remove("is-active");
      } else if (scroll >= 565 && scroll < 1130) {
        item[1].classList.remove("is-active");
        item[2].classList.add("is-active");
        item[3].classList.remove("is-active");
      } else if (scroll >= 1130) {
        item[1].classList.remove("is-active");
        item[2].classList.remove("is-active");
        item[3].classList.add("is-active");
      }
    });
  </script>
</html>
