<nav class="navbar is-black is-fixed-top"
     role="navigation"
     aria-label="main navigation"
     id="navbar">

  <div class="container">

    <!-- Branding -->
    <div class="navbar-brand">

      <a class="navbar-item" href="{{ site.baseurl }}/">
        <strong>{{ site.title }}</strong>
      </a>

      <div class="navbar-burger" data-target="navbar-menu">
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>


    <!-- Navigation -->
    <div class="navbar-menu has-background-black" id="navbar-menu">

      <div class="navbar-end">

        <a class="navbar-item
          {% if page.url == '/' %}is-active{% endif %}"
          href="{{ site.baseurl }}/">
          Home
        </a>


        <!-- Portfolio Dropdown -->
        <div class="navbar-item has-dropdown is-hoverable">

          <a class="navbar-link">
            Portfolio
          </a>

          <div class="navbar-dropdown">

            <a class="navbar-item"
               href="{{ site.baseurl }}/portfolio/systems-governance/">
              Cybersecurity Governance
            </a>

            <a class="navbar-item"
               href="{{ site.baseurl }}/portfolio/compliance/">
              Controls & Traceability
            </a>

            <a class="navbar-item"
               href="{{ site.baseurl }}/portfolio/api-docs/">
              API & Developer Documentation
            </a>

            <a class="navbar-item"
               href="{{ site.baseurl }}/portfolio/user-guides/">
              User & Operational Guides
            </a>

            <a class="navbar-item"
               href="{{ site.baseurl }}/portfolio/ux-edits/">
              UX Copy & Technical Edits
            </a>

          </div>

        </div>


        <a class="navbar-item"
           href="{{ site.baseurl }}/case-studies/">
          Case Studies
        </a>


        <a class="navbar-item"
           href="{{ '/about/' | relative_url }}">
          About
        </a>


        <a class="navbar-item"
           href="{{ site.baseurl }}/contact/">
          Contact
        </a>

      </div>

    </div>

  </div>
</nav>


<style>

/* ===========================================================
   PORTFOLIO DROPDOWN
   =========================================================== */

.navbar-dropdown a.navbar-item:hover {
  background-color: #f5f5f5 !important;
  color: #000 !important;
}


/* ===========================================================
   MOBILE HAMBURGER
   =========================================================== */

#navbar .navbar-burger {
  width: 3.25rem;
  height: 3.25rem;

  margin-left: auto;

  position: relative;

  background: transparent !important;
  border: 0;

  cursor: pointer;
}


/* Draw the three white hamburger lines */

#navbar .navbar-burger span {
  display: block;

  position: absolute;
  left: 50%;

  width: 21px;
  height: 2px;

  background-color: #ffffff !important;

  transform: translateX(-50%);
  transform-origin: center;

  transition:
    transform 0.18s ease,
    opacity 0.18s ease,
    top 0.18s ease;
}


#navbar .navbar-burger span:nth-child(1) {
  top: 17px;
}

#navbar .navbar-burger span:nth-child(2) {
  top: 24px;
}

#navbar .navbar-burger span:nth-child(3) {
  top: 31px;
}


/* Convert hamburger to X when open */

#navbar .navbar-burger.is-active span:nth-child(1) {
  top: 24px;

  transform:
    translateX(-50%)
    rotate(45deg);
}

#navbar .navbar-burger.is-active span:nth-child(2) {
  opacity: 0;
}

#navbar .navbar-burger.is-active span:nth-child(3) {
  top: 24px;

  transform:
    translateX(-50%)
    rotate(-45deg);
}


/* Mobile */

@media screen and (max-width: 1023px) {

  #navbar .navbar-burger {
    display: block !important;
  }

  #navbar .navbar-menu {
    display: none;
  }

  #navbar .navbar-menu.is-active {
    display: block !important;
  }

}


/* Desktop */

@media screen and (min-width: 1024px) {

  #navbar .navbar-burger {
    display: none !important;
  }

}

</style>


<script>

  document.addEventListener('DOMContentLoaded', function () {

    var $navbarBurgers =
      Array.prototype.slice.call(
        document.querySelectorAll('.navbar-burger'),
        0
      );

    if ($navbarBurgers.length > 0) {

      $navbarBurgers.forEach(function ($el) {

        $el.addEventListener('click', function () {

          var target = $el.dataset.target;
          var $target = document.getElementById(target);

          $el.classList.toggle('is-active');
          $target.classList.toggle('is-active');

        });

      });

    }

  });

</script>
