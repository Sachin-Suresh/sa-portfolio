<head>
    <!-- Basic Meta Tags -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>{{ page.title | default: site.title }}</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style> body { font-family: 'Inter', sans-serif; } </style>

    <!-- Bootstrap (if still needed) -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css" />

    <!-- Favicon -->
    <link rel="shortcut icon" href="{{ site.favicon-url | default: '/assets/images/logo.png' | absolute_url }}" type="image/x-icon" />

    <!-- Icons -->
    <script src="https://kit.fontawesome.com/6a97161b76.js" crossorigin="anonymous"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

    <!-- SEO Meta -->
    <meta name="description" content="{{ site.description }}">
    <meta name="keywords" content="{{ site.site-keywords }}">
    <meta name="author" content="{{ site.author-name }}">

    <!-- Open Graph -->
    <meta property="og:title" content="{{ site.title }}">
    <meta property="og:description" content="{{ site.description }}">
    <meta property="og:image" content="{{ site.site-image | default: site.url | append: '/assets/images/og-image.jpg' }}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ site.title }}">
    <meta name="twitter:description" content="{{ site.description }}">
    <meta name="twitter:image" content="{{ site.site-image | default: site.url | append: '/assets/images/og-image.jpg' }}">

    <!-- Canonical URL -->
    <link rel="canonical" href="{{ site.url }}{{ page.url | remove: 'index.html' }}">
  </head>
