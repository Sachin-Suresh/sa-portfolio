<head>
    <!-- Basic Meta Tags -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>{{ page.title | default: site.title }}</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style> body { font-family: 'Inter', sans-serif; } </style>

    <!-- Bootstrap (if still needed) -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css" />

    <!-- Favicon -->
    <link rel="shortcut icon" href="{{ site.favicon-url | default: '/assets/images/logo.png' | absolute_url }}" type="image/x-icon" />

    <!-- Icons -->
    <script src="https://kit.fontawesome.com/6a97161b76.js" crossorigin="anonymous"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

    <!-- SEO Meta -->
    <meta name="description" content="{{ site.description }}">
    <meta name="keywords" content="technical writing, documentation, portfolio, proofreading, UX writing, API docs, Sachin S">
    <meta name="author" content="{{ site.author-name }}">

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="{{ site.title }}">
    <meta property="og:description" content="{{ site.description }}">
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/images/og-image.jpg">
    <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}/">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://sachin-suresh.github.io/sa-portfolio/" />
    <meta property="twitter:title" content="Sachin S | Technical Writing Portfolio" />
    <meta property="twitter:description" content="Explore UX writing, documentation, and technical writing samples by Sachin Suresh." />
    <meta property="twitter:image" content="https://metatags.io/images/meta-tags.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}/">
  </head>
